# Booqable Rental Theme: local WordPress stack (wp-portfolio standard).
#
# One image, wp-portfolio-wordpress:7.1-php8.4, runs both the web server and
# WP-CLI, and every wp-portfolio project on this machine shares it.
#
#   bin/setup.sh                            first run: builds the image, provisions
#   docker compose up -d --wait             WordPress + MariaDB
#   bin/wp <command>                        WP-CLI (profile "cli", run on demand)
#   docker compose --profile tools up -d    adds phpMyAdmin
#   docker compose stop                     before starting another project
#
# There is deliberately no restart policy: a stack runs only while you work on
# it and does not come back by itself when Docker Desktop starts.
#
# Ports come in blocks of ten per project: +0 WordPress, +1 phpMyAdmin,
# +2 Mailpit, +3 n8n. This project owns 8080.

# Built from ./docker/wordpress by bin/setup.sh with a plain `docker build`,
# not by Compose: Compose stamps the project name into the image labels, so
# identical files would get a different image ID in every project. Run
# bin/setup.sh before the first `docker compose up`.
x-wordpress-image: &wordpress-image
  image: wp-portfolio-wordpress:7.1-php8.4
  pull_policy: never

# Referenced by both PHP services so they cannot drift. wp-config.php eval()s
# WORDPRESS_CONFIG_EXTRA at runtime, so a CLI with a different environment runs
# the same code differently from a web request.
#
# The Booqable access token is not here: it lives in the database
# (booqable_core_access_token) and never leaves the server.
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
  WORDPRESS_DB_USER: ${MYSQL_USER}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
  # The image defines WP_DEBUG from this variable *before* it eval()s
  # WORDPRESS_CONFIG_EXTRA, so a define() in that block is a silent no-op.
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    defined('WP_DEBUG_LOG')        || define('WP_DEBUG_LOG', true);
    defined('WP_DEBUG_DISPLAY')    || define('WP_DEBUG_DISPLAY', false);
    defined('SCRIPT_DEBUG')        || define('SCRIPT_DEBUG', true);
    defined('DISALLOW_FILE_EDIT')  || define('DISALLOW_FILE_EDIT', true);
    defined('WP_ENVIRONMENT_TYPE') || define('WP_ENVIRONMENT_TYPE', 'local');

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  wordpress:
    <<: *wordpress-image
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wordpress-env
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/booqable-rental-theme-core:/var/www/html/wp-content/plugins/booqable-rental-theme-core
      - ./wp-content/themes/booqable-rental-theme:/var/www/html/wp-content/themes/booqable-rental-theme
    # Healthy once the entrypoint has copied core and written wp-config.php,
    # which is what WP-CLI needs before its first command.
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && test -f /var/www/html/wp-includes/version.php"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  wpcli:
    <<: *wordpress-image
    profiles: ["cli"]
    # Same image as the web server, so www-data is already UID 33 and the
    # files it writes on the shared volume stay owned by the web server.
    user: www-data
    entrypoint: ["wp"]
    working_dir: /var/www/html
    depends_on:
      wordpress:
        condition: service_healthy
    environment: *wordpress-env
    # The wordpress service's mounts, plus bin/ read-only for `wp eval-file`.
    # bin/ is mounted here only, so scripts are never web-reachable.
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/booqable-rental-theme-core:/var/www/html/wp-content/plugins/booqable-rental-theme-core
      - ./wp-content/themes/booqable-rental-theme:/var/www/html/wp-content/themes/booqable-rental-theme
      - ./bin:/var/www/html/bin:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M

volumes:
  db_data:
  wp_data:
